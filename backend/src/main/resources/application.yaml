# tomcat
server:
  port: 8080
  tomcat:
    # 上传超限时尽量把 413 JSON 响应返回给客户端，避免连接被提前断开
    max-swallow-size: 10MB

# springboot
spring:
  profiles:
    active: dev
  servlet:
    multipart:
      # 单张图片最大 5MB
      max-file-size: 5MB
      # 单次 multipart 请求最大 10MB
      max-request-size: 10MB
  datasource:
    username: ${mysql.username}
    password: ${mysql.password}
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver

# mybatis-plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
#指定Mybatis的实体目录
  type-aliases-package: com.blog.pojo.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 运行日志（纯 application 配置，不使用 logback-spring.xml）
# 按激活的 profile 分目录：dev -> log/dev/blog-dev.log，pro -> log/pro/blog-pro.log；
# 相对路径基于 JVM 工作目录，在 MyBlog/backend 下启动时即 backend/log/**
logging:
  level:
    root: info
    com.blog: info
  file:
    name: ./log/${spring.profiles.active:dev}/blog-${spring.profiles.active:dev}.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
  charset:
    file: UTF-8
  logback:
    rollingpolicy:
      # 单个文件最大 10MB，按天 + 大小滚动，保留 30 份归档，归档总量上限 2GB
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 2GB

# 图片上传
upload:
  # 默认存储目录，相对 JVM 工作目录；dev 环境由 application-dev.yaml 覆盖
  dir: D:/VScodefile/Web/Blog/MyBlog/upload

############## Sa-Token 配置 (文档: https://sa-token.com) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # jwt秘钥
  jwt-secret-key: ${jwt.key}

