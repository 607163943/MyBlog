# tomcat
server:
  port: 8080

# springboot
spring:
  profiles:
    active: dev
  datasource:
    username: ${mysql.username}
    password: ${mysql.password}
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver

# mybatis-plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
#指定Mybatis的实体目录
  type-aliases-package: com.blog.pojo.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

